<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in — status.watch</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div data-nav></div>

<main class="container">
  <section class="section" style="max-width:420px;margin:0 auto;padding:60px 0 40px">
    <div class="card">
      <div class="row" style="border-bottom:1px solid var(--border);margin:-20px -20px 20px;padding:0 20px">
        <a href="#signup" class="tiny" style="padding:14px 0;border-bottom:2px solid var(--text);color:var(--text);font-weight:600">Create account</a>
        <a href="#login" class="tiny muted" style="padding:14px 0;margin-left:20px">Sign in</a>
      </div>
      <h1 style="margin:0 0 6px;font-size:22px;letter-spacing:-.02em">Start monitoring in 60 seconds</h1>
      <p class="tiny muted" style="margin:0 0 20px">10 monitors free forever. No credit card required.</p>

      <button class="oauth-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="row" style="margin:14px 0;color:var(--muted);gap:10px">
        <div style="flex:1;border-top:1px solid var(--border)"></div>
        <span class="tiny">or</span>
        <div style="flex:1;border-top:1px solid var(--border)"></div>
      </div>

      <form onsubmit="event.preventDefault();location='dashboard.html'">
        <label class="tiny muted">Email</label>
        <input class="btn" style="width:100%" type="email" placeholder="you@example.com" required />
        <div style="height:10px"></div>
        <label class="tiny muted">Password</label>
        <input class="btn" style="width:100%" type="password" placeholder="At least 8 characters" required />
        <div style="height:14px"></div>
        <button type="submit" class="btn btn-accent" style="width:100%">Create account →</button>
      </form>

      <p class="tiny muted" style="margin:14px 0 0">By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy</a>.</p>
    </div>
    <p class="tiny muted" style="text-align:center;margin-top:14px">Already have an account? <a href="#login">Sign in</a></p>
  </section>
</main>

<div data-footer></div>
<script src="partials.js"></script>
</body>
</html>
